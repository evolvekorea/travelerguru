  <link rel="canonical" href="https://travelerguru.co.kr/" />

  <!-- Google Adsense 코드 -->

    gtag('config', 'G-5TV9LY53LD');

  <!-- 네이버 인증 태그 -->
  <meta name="naver-site-verification" content="d8debc2895ddaeb9b1a69ff6753d9529e42f51ca" />

  <title>구루의 트래블 노트</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- 소셜 공유 미리보기 -->
  <meta property="og:title" content="구루의 트래블 노트" />
  <meta property="og:description" content="구루의 트래블 노트, 맛집, 여행, 숙소 등" />
  <meta property="og:url" content="https://www.travelerguru.co.kr" />
  <meta property="og:image" content="https://www.travelerguru.co.kr/images/head_image.jpg" />
  <meta property="og:type" content="website" />

  <!-- 오류 보안 -->
  <link rel="icon" href="data:," />
</head>
<body>

  <!-- 헤더 -->
  <header class="tg-header">
    <button class="icon-btn" aria-label="메뉴">☰</button>
    <h1 class="brand">구루의 트래블 노트</h1>
    <button class="icon-btn" aria-label="검색">🔎</button>
  </header>

  <main>
    <!-- SNS Split Links: 인스타 / 유튜브 -->
    <section class="social-split" aria-label="SNS 바로가기">
      <a class="social-card insta" href="https://www.instagram.com/traveler_guru1" target="_blank" rel="noopener noreferrer">
        <!-- ↓↓↓ 인스타 배경 이미지 URL -->
        <img src="https://www.travelerguru.co.kr/images/instar.png" alt="인스타그램 바로가기" loading="lazy">
        <span class="social-overlay">
          <span class="social-emoji">📸</span>
          <strong>인스타그램</strong>
        </span>
      </a>

      <a class="social-card yt" href="https://www.youtube.com/@travelerguru30" target="_blank" rel="noopener noreferrer">
        <!-- ↓↓↓ 유튜브 배경 이미지 URL -->
        <img src="여기에_유튜브_배경.jpg" alt="유튜브 바로가기" loading="lazy">
        <span class="social-overlay">
          <span class="social-emoji">▶️</span>
          <strong>유튜브</strong>
        </span>
      </a>
    </section>
    
    <!-- 히어로(상단 가로 스크롤 배너, 필요 없으면 지워도 됨) -->
    <section class="hero-row" aria-label="추천">
      <h2 class="row-title">오늘의 추천</h2>
      <div class="row scroller" data-row="hero">
        <!-- JS가 카드 삽입 -->
      </div>
      <div class="pager" data-pager="hero"></div>
    </section>

    <!-- 카테고리별 가로 슬라이드 4개 -->
    <section id="sec-travel" class="post-row" aria-label="여행">
      <div class="row-head">
        <h2 class="row-title">여행</h2>
        <a href="travel/" class="row-more">더보기 ›</a>
      </div>
      <div class="row scroller" data-row="travel"></div>
      <div class="pager" data-pager="travel"></div>
    </section>

    <section id="sec-food" class="post-row" aria-label="맛집">
      <div class="row-head">
        <h2 class="row-title">맛집</h2>
        <a href="food/" class="row-more">더보기 ›</a>
      </div>
      <div class="row scroller" data-row="food"></div>
      <div class="pager" data-pager="food"></div>
    </section>

    <section id="sec-stay" class="post-row" aria-label="숙소">
      <div class="row-head">
        <h2 class="row-title">숙소</h2>
        <a href="stay/" class="row-more">더보기 ›</a>
      </div>
      <div class="row scroller" data-row="stay"></div>
      <div class="pager" data-pager="stay"></div>
    </section>

    <section id="sec-other" class="post-row" aria-label="기타">
      <div class="row-head">
        <h2 class="row-title">기타</h2>
        <a href="other/" class="row-more">더보기 ›</a>
      </div>
      <div class="row scroller" data-row="other"></div>
      <div class="pager" data-pager="other"></div>
    </section>

    <!-- 광고 예시 -->
    <section class="ad-wrap">
      <ins class="adsbygoogle"
           style="display:block;min-height:90px"
           data-ad-client="ca-pub-6532882266109488"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </section>

  </main>

  <!-- 하단 탭 (선택) -->
  <nav class="tabbar" aria-label="탭">
    <a class="tab is-active" href="#"><span>🏠</span><em>홈</em></a>
    <a class="tab" href="food/"><span>🍜</span><em>맛집</em></a>
    <a class="tab" href="travel/"><span>🧭</span><em>여행</em></a>
    <a class="tab" href="stay/"><span>🛏️</span><em>숙소</em></a>
    <a class="tab" href="other/"><span>📎</span><em>기타</em></a>
  </nav>

  <script defer src="script.js"></script>
  <script>
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e) {}

</body>
