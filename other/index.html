<!DOCTYPE html>
<html lang="ko" data-cat="other">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>기타 유용한 정보 글목록 - 구루의 트래블 노트</title>
  <link rel="canonical" href="https://www.travelerguru.co.kr/other/">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="data:,">
  <meta name="description" content="기타 카테고리: 기타 유용한 정보">
  <!-- OG -->
  <meta property="og:title" content="기타 글 목록" />
  <meta property="og:description" content="구루의 트래블 노트 - 기타 카테고리" />
  <meta property="og:url" content="https://www.travelerguru.co.kr/other/" />
  <meta property="og:type" content="website" />

  <!-- Google Analytics 코드 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5TV9LY53LD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5TV9LY53LD');
  </script>
  
</head>
<body>

<header class="page-header">
  <h1 class="page-title">기타</h1>
</header>

<nav class="breadcrumb">
  <a href="/">홈</a> › <strong>기타</strong>
</nav>

<section class="toolbar" aria-label="필터">
  <input id="q" class="tool-input" type="search" placeholder="제목/본문 검색" aria-label="검색">
  <select id="rating" class="tool-select" aria-label="별점">
    <option value="">별점 전체</option>
    <option value="5">⭐️ 5</option>
    <option value="4">⭐️ 4+</option>
    <option value="3">⭐️ 3+</option>
    <option value="2">⭐️ 2+</option>
    <option value="1">⭐️ 1+</option>
  </select>
  <select id="sort" class="tool-select" aria-label="정렬">
    <option value="new">최신순</option>
    <option value="old">오래된순</option>
    <option value="title">제목순</option>
    <option value="rating">별점순</option>
  </select>
</section>

<main>
  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
</main>

<nav class="tabbar">
  <a class="tab" href="/"><span>🏠</span><em>홈</em></a>
  <a class="tab" href="/food/"><span>🍜</span><em>맛집</em></a>
  <a class="tab" href="/travel/"><span>🧭</span><em>여행</em></a>
  <a class="tab" href="/stay/"><span>🛏️</span><em>숙소</em></a>
  <a class="tab is-active" href="/other/"><span>📎</span><em>기타</em></a>
</nav>

<script>
  const CAT_MAP = {
    travel: { label:'여행', json:'index.json', base:'/travel' },
    food:   { label:'맛집', json:'../food/index.json', base:'/food' },
    stay:   { label:'숙소', json:'../stay/index.json', base:'/stay' },
    other:  { label:'기타', json:'../other/index.json', base:'/other' }
  };
  const CAT_KEY = document.documentElement.getAttribute('data-cat') || 'travel';
  const CONF = CAT_MAP[CAT_KEY];

  const grid = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');
  const q = document.getElementById('q');
  const sortSel = document.getElementById('sort');
  const ratingSel = document.getElementById('rating');

  let raw = [], view = [];

  function card(item){
    const a = document.createElement('a');
    a.href = item.url || '#';
    a.className = 'card';
    a.setAttribute('data-rating', (item.rating ?? ''));

    // ★ 별점 HTML 생성
    const ratingNum = Math.max(0, Math.min(5, Number(item.rating || 0)));
    const starsHTML = Array.from({ length: 5 }, (_, i) =>
      `<span class="star ${i < ratingNum ? 'filled' : 'empty'}">★</span>`
    ).join('');

    const badge = ratingNum > 0
      ? `<span class="star-badge" aria-label="별점 ${ratingNum}점">
           ${starsHTML}
           <span class="score">${ratingNum}</span>
         </span>`
      : '';

    a.innerHTML = `
      ${badge}
      <img class="card-img" src="${item.thumb || ''}" alt="${item.title || ''}" loading="lazy">
      <div class="card-body">
        <span class="card-cat"># ${CAT_MAP[CAT_KEY].label}</span>
        <h3 class="card-title">${item.title || ''}</h3>
        <p class="card-excerpt">${item.excerpt || ''}</p>
      </div>`;
    return a;
  }

  function render(){
    grid.innerHTML = '';
    view.forEach(it => grid.appendChild(card(it)));
    emptyEl.hidden = view.length > 0;
  }

  function apply(){
    const keyword = (q.value || '').trim().toLowerCase();
    const r = parseInt(ratingSel.value || 0, 10) || 0;

    view = raw.filter(it => {
      const okKeyword = !keyword ||
        (it.title||'').toLowerCase().includes(keyword) ||
        (it.excerpt||'').toLowerCase().includes(keyword);
      const rating = parseInt(it.rating || 0, 10) || 0;
      const okRating = r === 0 || rating >= r;
      return okKeyword && okRating;
    });

    const s = sortSel.value;
    if (s === 'new') view.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
    if (s === 'old') view.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    if (s === 'title') view.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
    if (s === 'rating') view.sort((a,b)=> (parseInt(b.rating||0,10)) - (parseInt(a.rating||0,10)));

    render();
  }

  (async function init(){
    const jsonPath = (CAT_KEY === 'food') ? 'index.json' : CONF.json;
    const res = await fetch(jsonPath, { cache: 'no-store' });
    raw = await res.json();

    const usp = new URLSearchParams(location.search);
    const initR = usp.get('rating');
    if (initR) ratingSel.value = initR;

    apply();
    q.addEventListener('input', apply);
    sortSel.addEventListener('change', apply);
    ratingSel.addEventListener('change', apply);
  })();
</script>
</body>
</html>
