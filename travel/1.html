<script>
  // 관련 글: 같은 카테고리 index.json에서 6개 추출 (현재 글 제외)
  (async function(){
    const ROW = document.getElementById('rel-row');
    try{
      const res = await fetch('./index.json', { cache:'no-store' });
      const list = await res.json();
      // 현재 파일명
      const here = location.pathname.split('/').pop();
      const pool = list.filter(it => (it.url||'').split('/').pop() !== here).slice(0,6);

      const mk = (it) => {
        const a = document.createElement('a');
        a.href = it.url || '#';
        a.className = 'card';
        a.innerHTML = `
          <img class="card-img" src="${it.thumb||''}" alt="${it.title||''}" loading="lazy">
          <div class="card-body">
            <span class="card-cat"># 여행</span>
            <h3 class="card-title">${it.title||''}</h3>
            <p class="card-excerpt">${it.excerpt||''}</p>
          </div>`;
        return a;
      };
      pool.forEach(p => ROW.appendChild(mk(p)));
    }catch(e){ console.warn(e); }
  })();
</script>
